name: Czech Extraliga Stats Scraper

on:
  schedule:
    - cron: '0 6 * * *'    # dagelijks 06:00 UTC
    - cron: '0 14 * * 5'   # vrijdag 14:00 UTC (na avondwedstrijden)
    - cron: '0 14 * * 6'   # zaterdag 14:00 UTC
    - cron: '0 18 * * 6'   # zaterdag 18:00 UTC
    - cron: '0 14 * * 0'   # zondag 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stats scrapen
        run: python extraliga-scraper.py

      - name: JSON committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Extraliga stats bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
