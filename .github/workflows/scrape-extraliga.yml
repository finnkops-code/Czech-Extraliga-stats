name: Update Extraliga stats

on:
  schedule:
    # Elke 3 uur tussen 06:00 en 23:00 UTC (wedstrijddagen + updates)
    - cron: "0 6-23/3 * * *"
  workflow_dispatch: {}   # handmatig starten via de Actions-tab

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Draai scraper
        run: python scraper.py

      - name: Commit & push bij wijzigingen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/splits.json data/meta.json
          # Alleen committen als stats.json of splits.json inhoudelijk wijzigde
          # (meta.json verandert elke run door de timestamp)
          if git diff --cached --quiet -- data/stats.json data/splits.json; then
            echo "Geen inhoudelijke wijzigingen — geen commit."
          else
            git commit -m "Update Extraliga stats ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
